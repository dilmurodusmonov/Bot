<style>
  :root {
    --bg: #F2F3F5;
    --secondary-bg: #FFFFFF;
    --text: #1C1C1E;
    --hint: #8E96A3;
    --section-bg: #FFFFFF;
    --border: rgba(0,0,0,0.08);
    --accent1: #FF9A5C;
    --accent2: #E5484D;
    --blue: #1C93F3;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  button { font-family: inherit; font-size: inherit; }
  #app { min-height: 100vh; padding: 16px 16px 110px; }
  .center-loader { display: flex; align-items: center; justify-content: center; height: 80vh; color: var(--hint); }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700;
  }
  .brand h1 { font-size: 18px; margin: 0; }
  .hint { color: var(--hint); font-size: 14px; margin: 0 0 16px; line-height: 1.4; }
  .option-list { display: flex; flex-direction: column; gap: 10px; }
  .option {
    background: var(--section-bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 14px; padding: 16px; font-size: 16px; font-weight: 500; text-align: left;
    display: flex; align-items: center; gap: 10px;
  }
  .menu-grid { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
  .menu-card {
    background: var(--section-bg); border: 1px solid var(--border); color: #000000;
    border-radius: 18px; padding: 8px 4px; font-size: 11px; font-weight: 600; text-align: center;
    display: flex; flex: 0 0 auto; flex-direction: column; align-items: center; gap: 4px;
    width: 118px; min-height: 54px; justify-content: center;
  }
  .menu-card .icon {
    width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid #1C1C1E;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .menu-card .icon svg { width: 14px; height: 14px; }
  label { display: block; font-size: 13.5px; color: var(--hint); margin: 16px 0 6px; }
  select, textarea, input {
    width: 100%; background: var(--section-bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 12px; padding: 12px 14px; font-size: 15px; font-family: inherit;
  }
  textarea { min-height: 96px; resize: vertical; }
  .note { color: var(--hint); font-size: 12.5px; margin-top: 14px; line-height: 1.4; }
  .card {
    background: var(--section-bg); border: 1px solid var(--border); border-radius: 16px;
    overflow: hidden; margin-bottom: 14px;
  }
  .card img { width: 100%; height: 150px; object-fit: cover; display: block; background: #232B36; }
  .card-body { padding: 12px 14px; }
  .card-cat { font-size: 12.5px; color: var(--hint); margin-bottom: 4px; }
  .card-desc { font-size: 15px; line-height: 1.4; margin-bottom: 8px; }
  .pill {
    display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px;
    background: rgba(0,0,0,0.06); margin-bottom: 8px;
  }
  .pill-available { color: #9AA7B3; }
  .pill-reserved { color: #FFB454; }
  .pill-shipped { color: #4EA4F5; }
  .pill-received { color: #3FCF7F; }
  .info-box { background: rgba(0,0,0,0.04); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; line-height: 1.6; margin-top: 8px; }
  .info-box .row { display: flex; gap: 6px; }
  .card-btn {
    margin-top: 10px; width: 100%; background: linear-gradient(135deg, var(--accent1), var(--accent2));
    color: #fff; border: none; border-radius: 10px; padding: 12px; font-size: 14.5px; font-weight: 600;
  }
  .card-btn-outline {
    margin-top: 8px; width: 100%; background: none; color: #C0392B;
    border: 1.5px solid #C0392B; border-radius: 10px; padding: 11px; font-size: 14px; font-weight: 600;
  }
  .empty-state { text-align: center; color: var(--hint); padding: 60px 20px; font-size: 14.5px; }
  .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cat-card {
    background: var(--section-bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 14px; padding: 18px 10px; font-size: 14px; font-weight: 500; text-align: center;
  }
  .error-box { background: rgba(229,72,77,0.12); color: #C0392B; border-radius: 10px; padding: 10px 12px; font-size: 13.5px; margin-top: 12px; }
  .photo-preview { display: none; width: 100%; max-height: 220px; object-fit: cover; border-radius: 12px; margin-top: 10px; border: 1px solid var(--border); }
  input[type="file"] { padding: 10px 12px; }

  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .avatar-img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 50%; background: var(--section-bg);
    border: 1px solid var(--border); color: var(--text); font-size: 19px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .stats-block { text-align: center; margin-bottom: 20px; }
  .stats-label { color: var(--hint); font-size: 13px; }
  .stats-value-wrap { position: relative; display: inline-block; margin: 4px 0; }
  .stats-value { font-size: 42px; font-weight: 800; letter-spacing: -0.5px; }
  .stats-badge-new {
    position: absolute; top: -4px; right: -34px;
    background: rgba(28,147,243,0.12); color: #1C93F3; font-size: 12px; font-weight: 700;
    padding: 2px 7px; border-radius: 10px; white-space: nowrap;
  }
  .delivery-stage { position: relative; height: 20px; max-width: 200px; overflow: hidden; margin: 0 auto; }
  .delivery-scooter-layer {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    animation: scooterPhase 18s ease-in-out infinite;
  }
  .delivery-scooter-layer .scooter {
    position: absolute; top: 50%; left: 105%; font-size: 15px;
    transform: translateY(-50%); animation: scooterDrive 18s linear infinite;
  }
  @keyframes scooterDrive {
    0% { left: 105%; }
    26% { left: -15%; }
    100% { left: -15%; }
  }
  @keyframes scooterPhase {
    0%, 24% { opacity: 1; }
    30%, 100% { opacity: 0; }
  }
  .delivery-fireworks-layer {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    opacity: 0; animation: fireworksPhase 18s ease-in-out infinite;
  }
  .firework-burst { position: relative; width: 4px; height: 4px; }
  .firework-burst .particle {
    position: absolute; top: 0; left: 0; width: var(--size, 4px); height: var(--size, 4px);
    border-radius: 50%; background: var(--spark-color, #FF9A5C);
    transform: rotate(var(--angle, 0deg)) translateX(0);
    animation: particleBurst 18s ease-out infinite;
  }
  @keyframes fireworksPhase {
    0%, 30% { opacity: 0; }
    33%, 44% { opacity: 1; }
    48%, 100% { opacity: 0; }
  }
  @keyframes particleBurst {
    0%, 30% { transform: rotate(var(--angle, 0deg)) translateX(0); opacity: 0; }
    36% { transform: rotate(var(--angle, 0deg)) translateX(calc(var(--dist, 28px) * 0.55)); opacity: 1; }
    46% { transform: rotate(var(--angle, 0deg)) translateX(var(--dist, 28px)); opacity: 0; }
    100% { transform: rotate(var(--angle, 0deg)) translateX(var(--dist, 28px)); opacity: 0; }
  }
  .delivery-value-layer {
    position: absolute; inset: 0; overflow: hidden; opacity: 0;
    animation: deliveryValuePhase 18s ease-in-out infinite;
  }
  .delivery-value-layer .value-text {
    position: absolute; top: 50%; left: 100%; white-space: nowrap;
    transform: translateY(-50%); font-size: 13.5px; font-weight: 700; color: #1C93F3;
    animation: valueSlide 18s linear infinite;
  }
  @keyframes deliveryValuePhase {
    0%, 47% { opacity: 0; }
    49%, 96% { opacity: 1; }
    100% { opacity: 0; }
  }
  @keyframes valueSlide {
    0%, 47% { left: 100%; }
    96% { left: -120%; }
    100% { left: -120%; }
  }
  .ad-banner { position: relative; height: 104px; border-radius: 16px; overflow: hidden; margin-bottom: 20px; }
  .ad-slide {
    position: absolute; inset: 0; display: flex; align-items: center; padding: 0 18px;
    color: #fff; font-weight: 700; font-size: 15px; letter-spacing: 0.5px; opacity: 0; transition: opacity .5s ease;
  }
  .ad-slide.active { opacity: 1; }
  .ad-slide.ad-1 { background: linear-gradient(135deg, #B79CFF, #8B6EF5); }
  .ad-slide.ad-2 { background: linear-gradient(135deg, #4EA4F5, #7C6CF5); }
  .ad-slide.ad-3 { background: linear-gradient(135deg, #3FCF7F, #2AA968); }
  .ad-dots {
    position: absolute; left: 0; right: 0; bottom: 10px; z-index: 2;
    display: flex; gap: 6px; justify-content: center;
  }
  .ad-dot { width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.45); transition: all .3s ease; }
  .ad-views {
    position: absolute; bottom: 8px; right: 10px; z-index: 2;
    display: flex; align-items: center; gap: 3px; background: rgba(0,0,0,0.4);
    color: #fff; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px;
  }
  .ad-views svg { width: 12px; height: 12px; }
  .ad-dot.active { width: 18px; background: #fff; }
  .section-card {
    background: #FFFFFF; border-radius: 20px; padding: 14px 12px; margin-bottom: 20px;
  }
  .section-title-blue { font-size: 17px; color: #1C93F3; font-weight: 700; margin: 2px 6px 10px; }
  .cat-list { display: flex; flex-direction: column; }
  .cat-row {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: none; border: none;
    color: #1C1C1E; padding: 12px 6px; font-size: 15px;
  }
  .cat-row-icon {
    width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
    background: rgba(120,140,160,0.15); display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .cat-row-name { flex: 1; font-weight: 700; }
  .cat-row-stats { display: flex; align-items: baseline; gap: 1px; font-weight: 700; font-size: 14.5px; }
  .cat-row-total { color: var(--text); }
  .cat-row-slash { color: #9AA3AF; }
  .cat-row-delivered { color: #1C93F3; }
  .cat-row-arrow { color: #9AA3AF; font-size: 18px; }
  .bottom-nav {
    position: fixed; left: 50%; bottom: max(12px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex; gap: 6px; background: #fff; border: 1px solid rgba(0,0,0,0.06);
    border-radius: 999px; padding: 5px; box-shadow: 0 6px 18px rgba(0,0,0,0.18); z-index: 10;
  }
  .nav-tab {
    position: relative;
    flex: 0 0 auto; min-width: 108px; display: flex; flex-direction: column; align-items: center; gap: 1px;
    background: none; border: none; border-radius: 999px; color: #000000; font-size: 11px;
    font-weight: 600; font-family: inherit; padding: 6px 4px; transition: background .2s ease, color .2s ease;
  }
  .nav-tab.active { color: #1C93F3; background: rgba(28,147,243,0.12); }
  .nav-badge {
    display: none; position: absolute; top: 2px; right: 20px;
    width: 9px; height: 9px; border-radius: 50%; background: #E5484D; border: 1.5px solid #fff;
  }
  .nav-badge.show { display: block; animation: navBadgeBlink 1.2s ease-in-out infinite; }
  @keyframes navBadgeBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }
  .nav-icon { font-size: 18px; display: inline-block; }
  @keyframes navIconPop {
    0% { transform: scale(1) rotate(0deg); }
    25% { transform: scale(1.28) rotate(-12deg); }
    50% { transform: scale(0.92) rotate(9deg); }
    75% { transform: scale(1.12) rotate(-5deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  .nav-icon-pop { animation: navIconPop 0.5s ease; }
</style>
</head>

  function tr(key) { return (UI[state.lang] && UI[state.lang][key]) || UI.uz[key] || key; }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function api(method, path, body) {
    var headers = { "X-Telegram-Init-Data": (tg && tg.initData) || "" };
    var payload;
    if (body instanceof FormData) {
      payload = body;
    } else if (body !== undefined) {
      headers["Content-Type"] = "application/json";
      payload = JSON.stringify(body);
    }
    return fetch(path, {
      method: method,
      headers: headers,
      body: payload,
    }).then(function (res) {
      if (!res.ok) {
        return res.text().then(function () {
          var err = new Error("http_" + res.status);
          err.status = res.status;
          throw err;
        });
      }
      if (res.status === 204) return null;
      return res.json();
    });
  }

  function goto(screen, params, push) {
    if (push !== false) navStack.push({ screen: state.screen, params: state.params });
    state.screen = screen;
    state.params = params || {};
    render();
  }

  function goBack() {
    var prev = navStack.pop();
    if (!prev) return;
    state.screen = prev.screen;
    state.params = prev.params;
    render();
  }

  function setMainButton(text, onClick) {
    if (!tg) return;
    tg.MainButton.offClick(tg.MainButton._lastHandler || function () {});
    if (!text) { tg.MainButton.hide(); return; }
    tg.MainButton.setText(text);
    tg.MainButton.show();
    tg.MainButton._lastHandler = onClick;
    tg.MainButton.onClick(onClick);
  }

  function hideMainButton() { setMainButton(null); }

  function setBackButton() {
    if (!tg) return;
    if (navStack.length > 0) {
      tg.BackButton.show();
    } else {
      tg.BackButton.hide();
    }
  }

  if (tg) { tg.BackButton.onClick(goBack); }

  function showError(msg) {
    var box = document.createElement("div");
    box.className = "error-box";
    box.textContent = msg || tr("error");
    app.appendChild(box);
  }

  function formatCount(n) {
    n = n || 0;
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, "") + "M";
    if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "K";
    return String(n);
  }

  function updateBottomNav() {
    var nav = document.getElementById("bottom-nav");
    if (!state.me.role) { nav.hidden = true; lastActiveNavRole = null; return; }
    nav.hidden = false;
    var roleChanged = state.me.role !== lastActiveNavRole;
    nav.querySelectorAll(".nav-tab").forEach(function (btn) {
      var isActive = btn.getAttribute("data-role") === state.me.role;
      btn.classList.toggle("active", isActive);
      if (isActive && roleChanged) {
        var icon = btn.querySelector(".nav-icon");
        icon.classList.remove("nav-icon-pop");
        void icon.offsetWidth;
        icon.classList.add("nav-icon-pop");
      }
    });
    lastActiveNavRole = state.me.role;
    var donorLabel = nav.querySelector('[data-tab-label="donor"]');
    var needyLabel = nav.querySelector('[data-tab-label="needy"]');
    if (donorLabel) donorLabel.textContent = tr("role_donor");
    if (needyLabel) needyLabel.textContent = tr("role_needy");
    refreshBadges();
  }

    api("GET", "/api/badges").then(function (badges) {

      var needyBadge = document.getElementById("badge-needy");
      if (donorBadge) donorBadge.classList.toggle("show", badges.donor_pending > 0);
      if (needyBadge) needyBadge.classList.toggle("show", badges.needy_pending > 0);

      api("POST", "/api/role", { role: role })

  });

  function wirePhotoPreview(inputId, previewId) {
    var input = document.getElementById(inputId);
    var preview = document.getElementById(previewId);
    input.addEventListener("change", function () {
      var file = input.files[0];
      if (!file) { preview.style.display = "none"; return; }
      var reader = new FileReader();
      reader.onload = function (e) {
        preview.src = e.target.result;
        preview.style.display = "block";
      };
      reader.readAsDataURL(file);
    });
  }

    home: renderHome,
    donor_add: renderDonorAdd,
    donor_cabinet: renderDonorCabinet,
    donor_ship_form: renderDonorShipForm,
    needy_categories: renderNeedyCategories,
    needy_list: renderNeedyList,
    needy_reserve_form: renderNeedyReserveForm,
    needy_cabinet: renderNeedyCabinet,
    needy_dua_form: renderNeedyDuaForm,
  };

  function render() {
    if (adTimer) { clearInterval(adTimer); adTimer = null; }
    var fn = screens[state.screen] || renderHome;
    fn();
    updateBottomNav();
  }

  var currentAdIndex = 0;
  var adViewedInSession = {};
  var adViewCache = {};

  function displayAdCount(slide) {
    var countEl = document.getElementById("ad-views-count");
    if (countEl && adViewCache[slide] !== undefined) {
      countEl.textContent = formatCount(adViewCache[slide]);
    }
  }

  function recordAdView(slide) {
    api("POST", "/api/ad-view", { slide: slide }).then(function (res) {
      adViewCache[slide] = res.views;
      displayAdCount(slide);
    }).catch(function () {});
  }

  function showAdSlide(index) {
    currentAdIndex = ((index % AD_COUNT) + AD_COUNT) % AD_COUNT;
    var banner = document.getElementById("ad-banner");
    var dots = document.getElementById("ad-dots");
    if (!banner || !dots) return;
    banner.querySelectorAll(".ad-slide").forEach(function (el, i) {
      el.classList.toggle("active", i === currentAdIndex);
    });
    dots.querySelectorAll(".ad-dot").forEach(function (el, i) {
      el.classList.toggle("active", i === currentAdIndex);
    });
    var slideNum = currentAdIndex + 1;
    if (!adViewedInSession[slideNum]) {
      adViewedInSession[slideNum] = true;
      recordAdView(slideNum);
    } else {
      displayAdCount(slideNum);
    }
  }

  function restartAdTimer() {
    if (adTimer) clearInterval(adTimer);
    adTimer = setInterval(function () { showAdSlide(currentAdIndex + 1); }, AD_INTERVAL_MS);
  }

  function startAdCarousel() {
    adViewedInSession = {};
    showAdSlide(0);
    restartAdTimer();

    var banner = document.getElementById("ad-banner");
    var dots = document.getElementById("ad-dots");
    if (!banner) return;

    var touchStartX = null;
    banner.addEventListener("touchstart", function (e) {
      touchStartX = e.touches[0].clientX;
    }, { passive: true });
    banner.addEventListener("touchend", function (e) {
      if (touchStartX === null) return;
      var dx = e.changedTouches[0].clientX - touchStartX;
      touchStartX = null;
      if (Math.abs(dx) < 30) return;
      showAdSlide(currentAdIndex + (dx < 0 ? 1 : -1));
      restartAdTimer();
    }, { passive: true });

    if (dots) {
      dots.querySelectorAll(".ad-dot").forEach(function (dot, i) {
        dot.addEventListener("click", function () {
          showAdSlide(i);
          restartAdTimer();
        });
      });
    }
  }

  api("GET", "/api/me")
    .then(function (me) {
      state.me = me;
      state.lang = me.language || "uz";
      if (!me.language) { goto("language", {}, false); }
      else if (!me.role) { goto("role", {}, false); }
      else { goto("home", {}, false); }
    })
    .catch(function () {
      var debug = {
        tg_exists: !!tg,
        initData_len: tg ? (tg.initData || "").length : null,
        initDataUnsafe: tg ? tg.initDataUnsafe : null,
        version: tg ? tg.version : null,
        platform: tg ? tg.platform : null,
        ua: navigator.userAgent,
      };
      app.innerHTML =
        '<div class="empty-state">Ulanishda xatolik.</div>' +
        '<pre style="text-align:left;white-space:pre-wrap;word-break:break-all;font-size:11px;background:var(--section-bg);padding:12px;border-radius:10px;">' +
        escapeHtml(JSON.stringify(debug, null, 2)) +
        "</pre>";
    });
})();
</script>
</body>
</html>
