          "</div></div>";
      }
      function isPreviewIncomplete(p) {
        return !p || !p.title || (/^@/.test(p.title) && !p.description);
      }

      function renderAdvertisePreview(preview, siteUrl) {
        var previewEl = document.getElementById("advertise-preview");
        if (!previewEl) return;
        if (!preview) { previewEl.innerHTML = ""; return; }
        if (!preview.title && !preview.description) {
          // Sayt serverimizga ma'lumot bermadi (anti-bot) — baribir domen nomi
          // va logotip bilan karta ko'rsatiladi.
          if (!siteUrl || siteUrl.indexOf(".") === -1) { previewEl.innerHTML = ""; return; }
          preview = { platform: preview.platform, title: deriveBrandFromUrl(siteUrl), description: "", photo_url: preview.photo_url };
        }
        var emoji = ADVERTISE_PLATFORM_EMOJI[preview.platform] || ADVERTISE_PLATFORM_EMOJI.website;
        var label = ADVERTISE_PLATFORM_LABEL[preview.platform] || ADVERTISE_PLATFORM_LABEL.website;
        var thumbHtml = brandThumbHtml(preview.photo_url, siteUrl, emoji);
        previewEl.innerHTML =
          '<div class="advertise-preview-card"><div class="advertise-preview-main">' +
          (preview.loading ? "" : '<button type="button" class="advertise-preview-edit-btn" data-adv-edit>✏️ ' + escapeHtml(tr("advertise_edit_btn")) + "</button>") +
          thumbHtml +
          '<div class="advertise-preview-info">' +
          '<div class="advertise-preview-platform">' + escapeHtml(emoji + " " + label) + "</div>" +
          (preview.title ? '<div class="advertise-preview-title">' + escapeHtml(preview.title) + "</div>" : "") +
          (preview.description ? '<div class="advertise-preview-desc">' + escapeHtml(preview.description) + "</div>" : "") +
          (preview.loading ? '<div class="advertise-preview-skeleton"></div><div class="advertise-preview-skeleton"></div>' : "") +
          "</div></div>" +
          (advertiseEditOpen && !preview.loading ? advertiseEditFormHtml(preview) : "") +
          '<div class="advertise-preview-foot">' +
          '<div class="advertise-preview-foot-label"><div>' + escapeHtml(tr("advertise_preview_new_brand")) + "</div><div>" +
          escapeHtml(tr("advertise_preview_checkout")) + "</div></div>" +
          '<div class="advertise-preview-foot-amount" id="advertise-preview-amount">' + escapeHtml(formatSom(bidTargetAmount)) + "</div>" +
          "</div></div>";
      }

      function guessAdvertisePlatform(u) {
        var h = deriveBrandFromUrl(u).toLowerCase();
        if (/(^|\.)(t\.me|telegram\.me)$/.test(h)) return "telegram";
        if (/(^|\.)instagram\.com$/.test(h)) return "instagram";
        if (/(^|\.)(youtube\.com|youtu\.be)$/.test(h)) return "youtube";
        if (h === "apps.apple.com") return "appstore";
        if (h === "play.google.com") return "googleplay";
        return "website";
      }

      // Bir marta olingan preview qayta yozilganda/qaytilganda darhol chiqadi.
      var advertisePreviewCache = {};

      var advertisePreviewTimer = null;
      // Maydonga bosilganda yonib-o'chish to'xtaydi.
      document.getElementById("advertise-url-input").addEventListener("focus", function () {
        this.classList.remove("advertise-field-warn");
      });
      document.getElementById("advertise-url-input").addEventListener("input", function () {
        if (advertisePreviewTimer) clearTimeout(advertisePreviewTimer);
        var urlInput = document.getElementById("advertise-url-input");
        var value = urlInput.value.trim();
        if (value) urlInput.classList.remove("advertise-field-warn");
        updateAdvertiseFormError(false);
        lastAdvertisePreview = null;
        lastAdvertisePreviewUrl = "";
        if (!value) { renderAdvertisePreview(null); return; }
        advertiseEditOpen = false;
        var cachedPreview = advertisePreviewCache[value.toLowerCase()];
        if (cachedPreview) {
          renderAdvertisePreview(cachedPreview, value);
          lastAdvertisePreview = cachedPreview;
          lastAdvertisePreviewUrl = value;
          return;
        }
        advertisePreviewTimer = setTimeout(function () {
          // Domen nomi va logotip darhol (logotip preview bilan parallel yuklanadi).
          if (/^[^\s]+\.[a-z\u0400-\u04ff]{2,}([\/?#].*)?$/i.test(value.replace(/^https?:\/\//i, ""))) {
            renderAdvertisePreview({ platform: guessAdvertisePlatform(value), title: deriveBrandFromUrl(value), description: "", photo_url: null, loading: true }, value);
          }
          api("GET", "/api/ads/preview?url=" + encodeURIComponent(value))
            .then(function (preview) {
              advertisePreviewCache[value.toLowerCase()] = preview;
              if (urlInput.value.trim() !== value) return;
              advertiseEditIncomplete = isPreviewIncomplete(preview);
              advertiseEditOpen = advertiseEditIncomplete;
              renderAdvertisePreview(preview, value);
              lastAdvertisePreview = preview;
              lastAdvertisePreviewUrl = value;
            })
            .catch(function () { if (urlInput.value.trim() === value) renderAdvertisePreview(null); });
        }, 350);
      });

      // Tahrirlash: ✏️ tugmasi, "Saqlash", logotip yuklash.
      var advertisePreviewEl = document.getElementById("advertise-preview");
      function currentPreviewForEdit() {
        var url = document.getElementById("advertise-url-input").value.trim();
        if (!lastAdvertisePreview || lastAdvertisePreviewUrl !== url) return null;
        return lastAdvertisePreview;
      }
      advertisePreviewEl.addEventListener("click", function (e) {
        var pv = currentPreviewForEdit();
        if (!pv) return;
        var url = lastAdvertisePreviewUrl;
        if (e.target.closest("[data-adv-edit]")) {
          advertiseEditOpen = !advertiseEditOpen;
          renderAdvertisePreview(pv, url);
          var nameEl = document.getElementById("advertise-edit-name");
          if (nameEl && !nameEl.value) nameEl.focus();
        } else if (e.target.closest("[data-adv-edit-save]")) {
          var name = document.getElementById("advertise-edit-name").value.trim();
          var desc = document.getElementById("advertise-edit-desc").value.trim();
          if (name) pv.title = name;
          pv.description = desc;
          advertiseEditOpen = false;
          advertiseEditIncomplete = false;
          renderAdvertisePreview(pv, url);
        }
      });
      advertisePreviewEl.addEventListener("change", function (e) {
        if (e.target.id !== "advertise-edit-file") return;
        var file = (e.target.files || [])[0];
        var pv = currentPreviewForEdit();
        if (!file || !pv) return;
        var url = lastAdvertisePreviewUrl;
        var btn = document.getElementById("advertise-edit-logo-btn");
        e.target.value = "";
        // Yozilgan nom/tavsif qayta chizishda yo'qolmasin.
        var nameNow = document.getElementById("advertise-edit-name").value.trim();
        var descNow = document.getElementById("advertise-edit-desc").value.trim();
        openLogoCropper(file).then(function (logo) {
          if (!logo) throw "cancel";
          if (btn) btn.textContent = tr("advertise_edit_uploading");
          var fd = new FormData();
          fd.append("photo", logo);
          return api("POST", "/api/ads/brand-logo", fd);
        }).then(function (res) {
          if (currentPreviewForEdit() !== pv) return;
          pv.photo_url = res.photo_url;
          if (nameNow) pv.title = nameNow;
          pv.description = descNow;
          renderAdvertisePreview(pv, url);
        }).catch(function (err) {
          if (err !== "cancel") showError();
          if (btn) btn.textContent = "📷 " + tr("advertise_edit_logo");
        });
      });

      document.getElementById("advertise-submit-btn").addEventListener("click", function () {
        var urlInputEl = document.getElementById("advertise-url-input");
        var url = urlInputEl.value.trim();
        // To'ldirilmagan maydonlar qizg'ish yonib-o'chadi; hammasi to'lganda to'lovga.
        var missing = [];
        if (!url) missing.push(urlInputEl);
        if (!selectedAdvertiseCategory) missing.push(advertiseCatTrigger);
        updateAdvertiseFormError(true);
        if (missing.length) {
          missing.forEach(function (el) {
            el.classList.remove("advertise-field-warn");
            void el.offsetWidth;   // animatsiya qayta boshlanishi uchun
            el.classList.add("advertise-field-warn");

  function copyToClipboard(text) {
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      showSnackbar(tr("advertise_copied"));
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { showSnackbar(tr("advertise_copied")); }, fallback);
    } else {
      fallback();
    }
  }

    // "Taklifni oshirish": uziq chiziqli summaga bosib N,N (mln so'm) kiritish.
    function raiseResultText(amount) {
      if (!p.currentAmount) return "";
      var total = p.currentAmount + amount;
      var rank = 1 + (p.otherAmounts || []).filter(function (a) { return a >= total; }).length;
      return trf("advertise_pay_raise_result", { amount: formatSom(total), n: String(rank) });
    }
    function renderRaiseResult(amount) {
      var el = document.getElementById("adpay-raise-result");
      if (el) el.textContent = raiseResultText(amount);

    if (isRaise) {
      var minRaise = p.minIncrement || 100000;

      var amountWrap = document.getElementById("adpay-amount");
      amountWrap.addEventListener("click", function () {
        var valueEl = document.getElementById("adpay-amount-value");
        if (!valueEl || document.getElementById("adpay-amount-input")) return;
        var input = document.createElement("input");
        input.id = "adpay-amount-input";
        input.className = "adpay-amount-input";
        input.type = "text";
        input.inputMode = "decimal";
        input.autocomplete = "off";
        input.value = (p.amount / 1000000).toFixed(2).replace(/0+$/, "").replace(/\.$/, "").replace(".", ",");
        function fit() { input.style.width = Math.max(2, input.value.length + 0.3) + "ch"; }
        fit();
        valueEl.style.display = "none";
        amountWrap.insertBefore(input, valueEl);
        document.getElementById("adpay-amount-unit").textContent = "mln so'm";
        function typedAmount() {
          var mln = parseFloat(input.value.replace(",", "."));
          return isFinite(mln) && mln > 0 ? Math.max(minRaise, Math.min(Math.round(mln * 100) * 10000, 100000000000)) : null;
        }
        input.addEventListener("input", function () {
          var v = input.value.replace(/\./g, ",").replace(/[^0-9,]/g, "");
          var i = v.indexOf(",");
          if (i !== -1) v = v.slice(0, i + 1) + v.slice(i + 1).replace(/,/g, "").slice(0, 2);
          v = v.replace(/^0+(?=\d)/, "").slice(0, 8);
          if (v !== input.value) input.value = v;
          fit();
          var a = typedAmount();
          if (a) renderRaiseResult(a);
        });
        var done = false;
        function commit() {
          if (done) return;
          done = true;
          var a = typedAmount();
          if (a) {
            if (a === minRaise && parseFloat(input.value.replace(",", ".")) * 1000000 < minRaise) {

  var currentAdIndex = 0;

  function getAdViewState() {
    try {

      return {};
    }
  }

  function setAdViewCount(slide, views) {
    try {
      var viewState = getAdViewState();
      viewState[slide] = views;
      sessionStorage.setItem("adViewState", JSON.stringify(viewState));
    } catch (e) {}

  function displayAdCount(slide, countElId) {
    var countEl = document.getElementById(countElId || "ad-views-count");

  function recordAdView(slide, countElId) {
    if (adViewPending[slide]) return;
    adViewPending[slide] = true;
    api("POST", "/api/ad-view", { slide: slide }).then(function (res) {
      adViewPending[slide] = false;
      adViewCache[slide] = res.views;
      setAdViewCount(slide, res.views);
      displayAdCount(slide, countElId);
    }).catch(function () { adViewPending[slide] = false; });
  }

  function showAdSlide(index) {
    currentAdIndex = ((index % AD_COUNT) + AD_COUNT) % AD_COUNT;
    var banner = document.getElementById("ad-banner");
    var dots = document.getElementById("ad-dots");
    if (!banner || !dots) return;
    banner.querySelectorAll(".ad-slide").forEach(function (el, i) {
      el.classList.toggle("active", i === currentAdIndex);
    });
    dots.querySelectorAll(".ad-dot").forEach(function (el, i) {
      el.classList.toggle("active", i === currentAdIndex);
    });
    var slideNum = currentAdIndex + 1;
    var viewState = getAdViewState();
    if (viewState[slideNum] !== undefined) {
      adViewCache[slideNum] = viewState[slideNum];
      displayAdCount(slideNum);
    } else {
      recordAdView(slideNum);
    }
  }

  function restartAdTimer() {
    if (adTimer) clearInterval(adTimer);
    adTimer = setInterval(function () { showAdSlide(currentAdIndex + 1); }, AD_INTERVAL_MS);
  }

  function startAdCarousel() {
    showAdSlide(0);
    restartAdTimer();

    var banner = document.getElementById("ad-banner");
    var dots = document.getElementById("ad-dots");
    if (!banner) return;

    var touchStartX = null;
    banner.addEventListener("touchstart", function (e) {
      touchStartX = e.touches[0].clientX;
    }, { passive: true });
    banner.addEventListener("touchend", function (e) {
      if (touchStartX === null) return;
      var dx = e.changedTouches[0].clientX - touchStartX;
      touchStartX = null;
      if (Math.abs(dx) < 30) return;
      showAdSlide(currentAdIndex + (dx < 0 ? 1 : -1));
      restartAdTimer();
    }, { passive: true });

    if (dots) {
      dots.querySelectorAll(".ad-dot").forEach(function (dot, i) {
        dot.addEventListener("click", function () {
          showAdSlide(i);
          restartAdTimer();
        });
      });
    }
  }

  // Tashqi havola: Telegram havolalari Telegram ichida, qolganlari brauzerda.
  function openExternalLink(url) {
    var full = /^https?:\/\//i.test(url) ? url : "https://" + url;
    var tgMatch = /^(?:https?:\/\/)?(?:t|telegram)\.me\/(.+)$/i.exec(full);
    if (tgMatch && tg && typeof tg.openTelegramLink === "function") {
      tg.openTelegramLink("https://t.me/" + tgMatch[1]);
    } else if (tg && typeof tg.openLink === "function") {
      tg.openLink(full);
    } else {
      window.open(full, "_blank");
    }
  }

  function startSimpleCarousel(bannerId, dotsId, slideOffset, viewsCountElId) {
    var banner = document.getElementById(bannerId);
    var dots = document.getElementById(dotsId);
    if (!banner) return null;
    var index = 0;
    var slides = banner.querySelectorAll(".ad-slide");
    var dotEls = dots ? dots.querySelectorAll(".ad-dot") : [];

    function show(i) {
      index = ((i % slides.length) + slides.length) % slides.length;
      slides.forEach(function (el, idx) { el.classList.toggle("active", idx === index); });
      dotEls.forEach(function (el, idx) { el.classList.toggle("active", idx === index); });
      if (slideOffset) {
        var slideNum = slideOffset + index;
        var viewState = getAdViewState();
        if (viewState[slideNum] !== undefined) {
          adViewCache[slideNum] = viewState[slideNum];
          displayAdCount(slideNum, viewsCountElId);
        } else {
          recordAdView(slideNum, viewsCountElId);
        }
      }
    }

    show(0);
    var timer = setInterval(function () { show(index + 1); }, AD_INTERVAL_MS);
    function restart() { clearInterval(timer); timer = setInterval(function () { show(index + 1); }, AD_INTERVAL_MS); }

    var touchStartX = null;
    banner.addEventListener("touchstart", function (e) { touchStartX = e.touches[0].clientX; }, { passive: true });
    banner.addEventListener("touchend", function (e) {
      if (touchStartX === null) return;
      var dx = e.changedTouches[0].clientX - touchStartX;
      touchStartX = null;
      if (Math.abs(dx) < 30) return;
      show(index + (dx < 0 ? 1 : -1));
      restart();
    }, { passive: true });

    dotEls.forEach(function (dot, i) {
      dot.addEventListener("click", function (e) { e.stopPropagation(); show(i); restart(); });
    });

    banner.addEventListener("click", function (e) {
      if (e.target.closest(".ad-dot")) return;
      // Reklama slaydi — brend sahifasi (klik hisoblanadi), aks holda reklama sahifasi.
      var slide = slides[index];
      var adUrl = slide && slide.getAttribute("data-ad-url");
      if (adUrl) {
        api("POST", "/api/ads/" + slide.getAttribute("data-ad-id") + "/click").catch(function () {});
        openExternalLink(adUrl);
      } else {
        goto("advertise");
      }
    });

    return { stop: function () { clearInterval(timer); } };
  }

  // tg.initDataUnsafe.auth_date Mini App har safar YANGI ochilganda
  // (jumladan xuddi shu havola qayta bosilganda) yangilanadi, lekin
  // bitta ochilish ichida sahifa reload qilinsa o'zgarmay qoladi.
  // Shuning uchun "bir marta ochish" belgisini id + auth_date juftligi
  // bilan qo'yamiz: xuddi shu ochilishda qayta ishlanmaydi, lekin
  // havola keyinroq (yangi auth_date bilan) yana bosilsa ishlayveradi.
  function deepLinkSessionKey(id) {
    var authDate = tg && tg.initDataUnsafe && tg.initDataUnsafe.auth_date;
    return id + ":" + (authDate || "");
  }

  function deepLinkDonationId() {
    var id = new URLSearchParams(location.search).get("d");
    if (!id && tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
      var startParam = tg.initDataUnsafe.start_param;
      if (startParam.indexOf("d_") === 0) id = startParam.slice(2);
    }
    if (!id) return null;
    try {
      if (sessionStorage.getItem(DEEPLINK_KEY) === deepLinkSessionKey(id)) return null;
    } catch (e) {}
    return id;
  }

  // Havoladan kelgan odam ehsonni olmoqchi, shuning uchun ehson muhtoj
  // tomonidagi ro'yxatda, "Qabul qilish" tugmasi bilan ochiladi.
  function openDeepLink(id) {
    try { sessionStorage.setItem(DEEPLINK_KEY, deepLinkSessionKey(id)); } catch (e) {}
    api("GET", "/api/donation/" + id)
      .then(function (d) {
        navStack = [{ screen: "home", params: {} }];
        goto("needy_list", { category: d.category, highlightId: id, fromChannel: true }, false);
      })
      .catch(function () { goto("home", {}, false); });
  }

  // --- bot chatidagi "Chekni ko'rish" tugmasi orqali ochish ------------------

  var RECEIPT_DEEPLINK_KEY = "ehson_receipt_deeplink_done";

  function receiptDeepLink() {
    var params = new URLSearchParams(location.search);
    var reservationId = params.get("r");
    var screen = params.get("screen");
    if (!reservationId || !screen || !screens[screen]) return null;
    try {
      if (sessionStorage.getItem(RECEIPT_DEEPLINK_KEY) === deepLinkSessionKey(reservationId)) return null;
    } catch (e) {}
    return { reservationId: reservationId, screen: screen, activeTab: params.get("activeTab") || undefined };
  }

  // Saqlangan navigatsiya holatidan ustun turadi — aks holda foydalanuvchi
  // avvalgi sahifada qolib, chekni topolmay qoladi.
  function openReceiptDeepLink(link) {
    try { sessionStorage.setItem(RECEIPT_DEEPLINK_KEY, deepLinkSessionKey(link.reservationId)); } catch (e) {}
    navStack = [{ screen: "home", params: {} }];
    goto(link.screen, { activeTab: link.activeTab, highlightReservationId: link.reservationId }, false);
  }

  // Onlayn / tashrif buyuruvchilar: ilova ochiq turganda har 45 soniyada.
  var presenceCounts = null;
  function presenceHtml() {
    if (!presenceCounts) return "";
    function num(n) { return (n || 0).toLocaleString("ru-RU").replace(/\u00a0/g, " "); }
    return '<span class="advertise-presence-dot"></span>' +
      '<span class="advertise-presence-online">' + escapeHtml(trf("advertise_presence_online", { n: num(presenceCounts.online) })) + "</span>" +
      " · " + escapeHtml(trf("advertise_presence_visitors", { n: num(presenceCounts.visitors) }));
  }
  function updatePresencePill() {
    var el = document.getElementById("advertise-presence");
    if (!el) return;
    el.innerHTML = presenceHtml();
    el.hidden = !presenceCounts;
  }
  function pingPresence() {
    api("POST", "/api/presence").then(function (c) {
      presenceCounts = c;
      updatePresencePill();
    }).catch(function () {});
  }
  var presenceTimer = null;
  function startPresence() {
    if (presenceTimer) return;
    pingPresence();
    presenceTimer = setInterval(function () { if (!document.hidden) pingPresence(); }, 45000);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) pingPresence(); });
  }

  api("GET", "/api/me")
    .then(function (me) {
      state.me = me;
      startPresence();
      state.lang = me.language || "uz";
      if (!me.language) { goto("language", {}, false); return; }
      if (!me.role) { goto("role", {}, false); return; }
      // Kanaldagi havola saqlangan sahifadan ustun turadi.
      var deepId = deepLinkDonationId();
      if (deepId) { openDeepLink(deepId); return; }
      var receiptLink = receiptDeepLink();
      if (receiptLink) { openReceiptDeepLink(receiptLink); return; }
      var saved = loadNavState();
      var restorable = saved && saved.screen && screens[saved.screen] &&
        saved.screen !== "loading" && saved.screen !== "language" && saved.screen !== "role";
      if (restorable) {
        state.screen = saved.screen;
        state.params = saved.params || {};
        navStack = Array.isArray(saved.navStack) ? saved.navStack : [];
        render();
        return;
      }
      var targetScreen = new URLSearchParams(location.search).get("screen");
      if (targetScreen && screens[targetScreen]) {
        navStack = [{ screen: "home", params: {} }];
        goto(targetScreen, {}, false);
        return;
      }
      goto("home", {}, false);
    })
    .catch(function () {
      var debug = {
        tg_exists: !!tg,
        initData_len: tg ? (tg.initData || "").length : null,
        initDataUnsafe: tg ? tg.initDataUnsafe : null,
        version: tg ? tg.version : null,
        platform: tg ? tg.platform : null,
        ua: navigator.userAgent,
      };
      app.innerHTML =
        '<div class="empty-state">Ulanishda xatolik.</div>' +
        '<pre style="text-align:left;white-space:pre-wrap;word-break:break-all;font-size:11px;background:var(--section-bg);padding:12px;border-radius:10px;">' +
        escapeHtml(JSON.stringify(debug, null, 2)) +
        "</pre>";
    });
})();
</script>
</body>
</html>
